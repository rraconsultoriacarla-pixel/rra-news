- name: Executar robô de notícias
        run: |
          python scripts/atualizar_noticias.py
on:
  workflow_dispatch:
  schedule:
    # Executa todo dia às 06:00 da manhã (Horário de Brasília)
    - cron: '0 9 * * *'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar robô de notícias
        run: |
          python atualizar_noticias.py

      - name: Salvar alterações no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática de 30 notícias contábeis via RSS"
          file_pattern: "noticias.json"
          commit_options: '--no-verify'
          skip_ci: true
