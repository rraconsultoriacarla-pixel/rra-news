name: Atualizar Noticias Contabeis

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install google-genai

      - name: Executar robô de notícias
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/atualizar_noticias.py

      - name: Enviar noticias.json atualizado para o GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Atualização automática de notícias contábeis [skip ci]" || exit 0
          git push
