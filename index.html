<main>
        <h2 class="section-title">Últimas Atualizações</h2>
        <div class="news-grid" id="newsGrid">
            <p style="color: var(--text-gray); grid-column: 1/-1;">Carregando atualizações recentes...</p>
        </div>
    </main>

    <footer class="main-footer">
        &copy; 2026 RRA Contabilidade - Todos os direitos reservados.
    </footer>

    <script>
        let newsData = [];

        async function carregarNoticiasAutomaticas() {
            try {
                const response = await fetch('./noticias.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('Arquivo de notícias não encontrado.');
                newsData = await response.json();
                
                if (!Array.isArray(newsData)) newsData = [];

                renderNews('all'); 
            } catch (error) {
                console.error("Erro ao carregar as notícias:", error);
                document.getElementById('newsGrid').innerHTML = '<p style="color: red; grid-column: 1/-1;">Não foi possível carregar as notícias. Verifique se o arquivo noticias.json está na mesma pasta.</p>';
            }
        }

        window.onload = function() {
            carregarNoticiasAutomaticas();
        };

        function renderNews(filter = 'all') {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';

            const normalizedFilter = filter.trim().toLowerCase();

            const filteredNews = normalizedFilter === 'all' 
                ? newsData 
                : newsData.filter(item => item.category && item.category.trim().toLowerCase() === normalizedFilter);

            if (filteredNews.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-gray); grid-column: 1/-1;">Nenhuma notícia encontrada para esta categoria.</p>';
                return;
            }

            filteredNews.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';
                
                const safeUrl = item.sourceUrl && item.sourceUrl.startsWith('http') ? item.sourceUrl : "https://www.contabeis.com.br";

                // Botão configurado como link direto (<a>) para a notícia completa
                card.innerHTML = `
                    <div>
                        <span class="news-category">${item.category || 'Geral'}</span>
                        <h3>${item.title}</h3>
                        <p>${item.summary}</p>
                    </div>
                    <a href="${safeUrl}" class="read-more-btn" target="_blank" rel="noopener noreferrer" style="text-decoration: none; display: inline-block; text-align: center;">Acessar Notícia Completa &rarr;</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterNews(categoryName, buttonElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if(buttonElement) {
                buttonElement.classList.add('active');
            } else {
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    if(btn.textContent.trim().toLowerCase() === categoryName.toLowerCase()) {
                        btn.classList.add('active');
                    }
                });
            }
            renderNews(categoryName);
        }
    </script>
